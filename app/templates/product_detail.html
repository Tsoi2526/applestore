{% extends "base.html" %}
{% block content %}
<div class="container container-custom mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('main.index') }}">首頁</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('main.products') }}">產品</a></li>
            <li class="breadcrumb-item active">{{ product.name }}</li>
        </ol>
    </nav>
    <div class="row g-5">
        <div class="col-md-6">
            <img src="{{ product.image_url or 'https://via.placeholder.com/600x600?text=Apple+Product' }}" class="img-fluid rounded-4" alt="{{ product.name }}">
        </div>
        <div class="col-md-6">
            <h1 style="font-weight: 600;">{{ product.name }}</h1>
            <p class="text-muted">分類：{{ product.category.name }}</p>
            <h3 class="text-primary" style="font-weight: 500;">HK${{ "%.2f"|format(product.price) }}</h3>
            <p class="mt-3">{{ product.description }}</p>
            <form method="POST" action="{{ url_for('main.add_to_cart', product_id=product.id) }}">
                <div class="mb-3">
                    <label for="quantity" class="form-label">數量</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1" class="form-control" style="width: 100px;">
                </div>
                <button type="submit" class="btn btn-apple btn-lg">加入購物車</button>
                <a href="{{ url_for('main.products') }}" class="btn btn-outline-apple btn-lg ms-2">繼續購物</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
